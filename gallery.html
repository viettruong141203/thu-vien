<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CloudLens - Thư Viện Ảnh</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --primary: #8b5cf6; --secondary: #3b82f6; --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08); --text-sub: #a1a1aa; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { min-height: 100vh; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; background: var(--bg); color: #fff; padding: 30px 20px; overflow-x: hidden; }
        
        .aurora-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; background: #000; overflow: hidden; }
        .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.5; animation: float 10s infinite ease-in-out alternate; }
        .orb-1 { width: 300px; height: 300px; background: var(--primary); top: -50px; left: -50px; }
        .orb-2 { width: 400px; height: 400px; background: var(--secondary); bottom: -100px; right: -100px; animation-delay: -5s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 50px) scale(1.2); } }

        .glass-card { background: var(--glass-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid var(--glass-border); border-radius: 32px; padding: 35px 25px; width: 100%; max-width: 600px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.6); }
        h2 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
        p.subtitle { font-size: 14px; color: var(--text-sub); margin-bottom: 25px; }

        .loading-state { display: flex; align-items: center; justify-content: center; gap: 10px; color: #a1a1aa; font-size: 14px; margin: 40px 0; }
        .spinner { width: 24px; height: 24px; border: 2px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* LƯỚI ẢNH (Grid) */
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        @media (min-width: 500px) { .gallery-grid { grid-template-columns: repeat(4, 1fr); } }
        
        .gallery-item { aspect-ratio: 1 / 1; border-radius: 12px; overflow: hidden; position: relative; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); text-decoration: none; display: block; background: rgba(0,0,0,0.3); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        .gallery-item:hover img { transform: scale(1.1); }
        .gallery-id { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); color: white; font-size: 10px; padding: 4px; text-align: center; }
    </style>
</head>
<body>
    <div class="aurora-bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

    <div class="glass-card">
        <h2>Thư viện ảnh</h2>
        <p class="subtitle">Những hình ảnh đã tải lên gần đây</p>
        
        <div class="loading-state" id="galleryLoader">
            <div class="spinner"></div> Đang tải thư viện...
        </div>
        
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby7QlHVDoWr7aQJMzLrfMWaCukXkFisq3A1BdLhyqcbdnPq2JvsJ0xgmkXrCbYBAKMtRQ/exec';
        
        const galleryGrid = document.getElementById('galleryGrid');
        const galleryLoader = document.getElementById('galleryLoader');
        
        let currentData = []; // Lưu trữ dữ liệu hiện tại để so sánh

        function renderGallery(data) {
            if(data.length === 0) {
                galleryGrid.innerHTML = '<p style="grid-column: 1/-1; color:#a1a1aa; padding: 20px 0;">Chưa có ảnh nào được tải lên.</p>';
                return;
            }
            
            const baseUrl = window.location.href.replace(/gallery\.html.*/, '').replace(/\/$/, '');
            let htmlContent = '';
            
            data.forEach(img => {
                htmlContent += `
                    <a class="gallery-item" href="${baseUrl}/view.html?id=${img.id}">
                        <img src="${img.thumb}" loading="lazy" alt="${img.id}">
                        <div class="gallery-id">${img.id}</div>
                    </a>
                `;
            });
            
            galleryGrid.innerHTML = htmlContent;
        }

        // Hàm fetch dữ liệu (có cờ isFirstLoad để biết là tải lần đầu hay tải ngầm)
        function fetchGalleryData(isFirstLoad = false) {
            fetch(APPS_SCRIPT_URL + "?action=gallery")
            .then(res => res.json())
            .then(result => {
                if (isFirstLoad) galleryLoader.style.display = 'none';
                
                if (result.status === 'success') {
                    const newData = result.data;
                    
                    // Kiểm tra xem có ảnh mới không (so sánh số lượng hoặc ID của ảnh đầu tiên)
                    let hasChanges = false;
                    if (newData.length !== currentData.length) {
                        hasChanges = true;
                    } else if (newData.length > 0 && currentData.length > 0 && newData[0].id !== currentData[0].id) {
                        hasChanges = true;
                    }
                    
                    // Chỉ cập nhật lại màn hình (Render) nếu phát hiện có sự thay đổi
                    if (hasChanges || isFirstLoad) {
                        currentData = newData;
                        renderGallery(currentData);
                    }
                }
            }).catch(() => {
                if (isFirstLoad) {
                    galleryLoader.style.display = 'none';
                    galleryGrid.innerHTML = '<p style="grid-column: 1/-1; color:#f87171;">Lỗi tải dữ liệu mạng!</p>';
                }
            });
        }

        // 1. Chạy lần đầu tiên khi vừa mở trang (Có hiện hiệu ứng quay quay)
        fetchGalleryData(true);

        // 2. Chạy ngầm tự động làm mới mỗi 2 giây (Không làm gián đoạn màn hình)
        setInterval(() => {
            fetchGalleryData(false);
        }, 2000); // 2000 ms = 2 giây
    </script>
</body>
</html>
