<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CloudLens - Upload</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --primary: #8b5cf6; --secondary: #3b82f6; --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08); --text-sub: #a1a1aa; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: var(--bg); color: #fff; padding: 20px; overflow-x: hidden; }
        
        .aurora-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; background: #000; overflow: hidden; }
        .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.5; animation: float 10s infinite ease-in-out alternate; }
        .orb-1 { width: 300px; height: 300px; background: var(--primary); top: -50px; left: -50px; }
        .orb-2 { width: 400px; height: 400px; background: var(--secondary); bottom: -100px; right: -100px; animation-delay: -5s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 50px) scale(1.2); } }

        .glass-card { background: var(--glass-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid var(--glass-border); border-radius: 32px; padding: 35px 25px; width: 100%; max-width: 440px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.6); }
        .logo svg { width: 48px; height: 48px; fill: url(#grad); filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.5)); margin-bottom: 15px;}
        h2 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
        p.subtitle { font-size: 14px; color: var(--text-sub); margin-bottom: 25px; }

        /* HAI NÚT CHỌN ẢNH VÀ CHỤP ẢNH */
        .upload-options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; }
        .option-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 25px 10px; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
        .option-card:hover { background: rgba(139, 92, 246, 0.1); border-color: var(--primary); transform: translateY(-3px); }
        .opt-icon { font-size: 32px; }
        .opt-text { font-size: 15px; font-weight: 500; color: #e4e4e7; }
        
        #fileCamera, #fileGallery { display: none; }

        .image-wrapper { border-radius: 20px; overflow: hidden; display: none; position: relative; border: 1px solid var(--glass-border); background: #000; }
        .image-wrapper img { width: 100%; max-height: 400px; object-fit: contain; display: block; }
        
        .action-group { display: none; gap: 12px; margin-top: 20px; }
        .btn { flex: 1; padding: 14px 10px; border-radius: 16px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; color: #fff; transition: 0.3s; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); }
        .btn-outline { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
        
        .loading-overlay { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); padding: 8px 12px; border-radius: 20px; display: none; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; border: 1px solid rgba(255,255,255,0.1); }
        .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .result-box { display: none; margin-top: 25px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 20px; text-align: left; }
        .result-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .label { font-size: 12px; color: var(--text-sub); text-transform: uppercase; font-weight: 600; }
        .value { font-size: 16px; font-weight: 700; color: #fff; }
        .link-value { font-size: 14px; color: #a78bfa; word-break: break-all; text-decoration: none; }
        .reset-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; padding: 16px; border-radius: 18px; font-size: 16px; font-weight: 600; color: #fff; cursor: pointer; margin-top: 20px; display: none; }
        
        .nav-btn { display: inline-block; margin-top: 25px; padding: 12px 24px; border-radius: 14px; font-size: 14px; font-weight: 500; color: var(--text-sub); background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); text-decoration: none; transition: 0.3s; }
        .nav-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; padding: 12px 24px; border-radius: 100px; font-size: 14px; font-weight: 500; backdrop-filter: blur(10px); transition: 0.4s; z-index: 1000; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.4); color: #f87171; }
    </style>
</head>
<body>
    <div class="aurora-bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
    <svg width="0" height="0"><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" /><stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" /></linearGradient></svg>

    <div class="glass-card" id="uploadView">
        <div id="uploadSection">
            <div class="logo"><svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5-5-5 5h3v4h4v-4h3z"/></svg></div>
            <h2>CloudLens</h2>
            <p class="subtitle">Bảo mật - Nhanh chóng - Tiện lợi</p>

            <!-- 2 Nút Chọn hoặc Chụp ảnh riêng biệt -->
            <div class="upload-options">
                <div class="option-card" id="btnCamera">
                    <span class="opt-icon">📸</span>
                    <span class="opt-text">Chụp ảnh</span>
                </div>
                <div class="option-card" id="btnGallery">
                    <span class="opt-icon">🖼️</span>
                    <span class="opt-text">Chọn ảnh</span>
                </div>
            </div>
            
            <!-- 2 Input tương ứng ẩn phía sau -->
            <input type="file" id="fileCamera" accept="image/*" capture="environment">
            <input type="file" id="fileGallery" accept="image/*">
        </div>

        <div class="image-wrapper" id="imageWrapper">
            <img id="imagePreview" src="" alt="View">
            <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div> Đang đồng bộ...</div>
        </div>

        <div class="action-group" id="confirmActions">
            <button type="button" class="btn btn-outline" id="cancelBtn">Chọn lại</button>
            <button type="button" class="btn btn-primary" id="saveBtn">Lưu đám mây</button>
        </div>

        <div class="result-box" id="resultBox">
            <div class="result-row"><div class="label">Mã ID</div><div class="value" id="displayId">...</div></div>
            <div style="height: 1px; background: rgba(255,255,255,0.1); margin: 15px 0;"></div>
            <div class="result-row" style="flex-direction: column; align-items: flex-start; gap: 8px;">
                <div class="label">Link xem ảnh (Nhấn để copy)</div>
                <a href="#" class="link-value" id="displayLink">...</a>
            </div>
        </div>
        <button type="button" class="reset-btn" id="resetBtn">Tải ảnh mới ➕</button>
    </div>

    <!-- Nút đi tới Thư viện ảnh -->
    <a href="gallery.html" class="nav-btn">🖼️ Đi tới Thư viện ảnh</a>

    <div class="toast" id="toastMsg">Thành công!</div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby7QlHVDoWr7aQJMzLrfMWaCukXkFisq3A1BdLhyqcbdnPq2JvsJ0xgmkXrCbYBAKMtRQ/exec';
        
        const uploadSection = document.getElementById('uploadSection');
        const imageWrapper = document.getElementById('imageWrapper');
        const imagePreview = document.getElementById('imagePreview');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const confirmActions = document.getElementById('confirmActions');
        const resultBox = document.getElementById('resultBox');
        const displayId = document.getElementById('displayId');
        const displayLink = document.getElementById('displayLink');
        const cancelBtn = document.getElementById('cancelBtn');
        const saveBtn = document.getElementById('saveBtn');
        const resetBtn = document.getElementById('resetBtn');
        const toastMsg = document.getElementById('toastMsg');
        
        let pendingFile = null;

        function showToast(text, isError = false) {
            toastMsg.textContent = text; toastMsg.className = isError ? 'toast show error' : 'toast show';
            setTimeout(() => { toastMsg.className = 'toast'; }, 3000);
        }

        function compressImage(file, callback) {
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = e => {
                const img = new Image(); img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > h && w > 1600) { h *= 1600 / w; w = 1600; } 
                    else if (h > 1600) { w *= 1600 / h; h = 1600; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                }
            }
        }

        // Logic gắn sự kiện cho 2 nút bấm
        const btnCamera = document.getElementById('btnCamera');
        const btnGallery = document.getElementById('btnGallery');
        const fileCamera = document.getElementById('fileCamera');
        const fileGallery = document.getElementById('fileGallery');

        btnCamera.addEventListener('click', () => fileCamera.click());
        btnGallery.addEventListener('click', () => fileGallery.click());

        // Xử lý chung khi file được chọn từ 1 trong 2 input
        function handleFileSelect(e) {
            if (this.files && this.files[0]) {
                pendingFile = this.files[0];
                const reader = new FileReader();
                reader.onload = event => {
                    imagePreview.src = event.target.result;
                    uploadSection.style.display = 'none';
                    imageWrapper.style.display = 'block';
                    confirmActions.style.display = 'flex';
                }
                reader.readAsDataURL(pendingFile);
            }
        }

        fileCamera.addEventListener('change', handleFileSelect);
        fileGallery.addEventListener('change', handleFileSelect);

        cancelBtn.addEventListener('click', () => {
            fileCamera.value = ''; fileGallery.value = '';
            uploadSection.style.display = 'block'; imageWrapper.style.display = 'none'; confirmActions.style.display = 'none';
        });

        saveBtn.addEventListener('click', () => {
            if (!pendingFile) return;
            confirmActions.style.display = 'none'; loadingOverlay.style.display = 'flex';
            
            compressImage(pendingFile, (compressedBase64) => {
                fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ fileName: pendingFile.name, mimeType: 'image/jpeg', base64: compressedBase64 })
                }).then(res => res.json()).then(result => {
                    loadingOverlay.style.display = 'none';
                    if (result.status === "success") {
                        showToast('Đã lưu vào Drive!'); displayId.textContent = result.id;
                        const baseUrl = window.location.href.replace(/index\.html.*/, '').replace(/\/$/, '');
                        const shareUrl = baseUrl + "/view.html?id=" + result.id;
                        
                        displayLink.textContent = shareUrl; displayLink.href = shareUrl;
                        resultBox.style.display = 'block'; resetBtn.style.display = 'block';
                    } else { showToast('Lỗi: ' + result.message, true); cancelBtn.click(); }
                }).catch(() => {
                    loadingOverlay.style.display = 'none'; showToast('Lỗi mạng!', true); cancelBtn.click();
                });
            });
        });

        displayLink.addEventListener('click', (e) => {
            e.preventDefault(); navigator.clipboard.writeText(displayLink.href).then(() => showToast('Đã copy link!'));
        });
        resetBtn.addEventListener('click', () => { cancelBtn.click(); resultBox.style.display = 'none'; resetBtn.style.display = 'none'; });
    </script>
</body>
</html>
