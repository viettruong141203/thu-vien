<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudLens - Kho Ảnh Thông Minh</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top left, #1e1b4b, #09090b);
            --primary: #6366f1;
            --accent: #a855f7;
            --glass-bg: rgba(24, 24, 27, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-sub: #a1a1aa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-gradient);
            color: #ffffff;
            padding: 20px;
        }

        .upload-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 35px 30px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .logo-badge {
            width: 50px; height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 16px;
            display: flex; justify-content: center; align-items: center;
            margin: 0 auto 20px;
        }
        .logo-badge svg { width: 24px; height: 24px; fill: white; }

        h2 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
        p.subtitle { font-size: 13px; color: var(--text-sub); margin-bottom: 28px; }

        #uploadSection { display: block; }
        .drop-zone {
            border: 2px dashed rgba(255, 255, 255, 0.12);
            border-radius: 20px; padding: 35px 20px;
            cursor: pointer; transition: all 0.3s;
            background: rgba(255, 255, 255, 0.02);
        }
        .drop-zone:hover { border-color: var(--primary); background: rgba(99, 102, 241, 0.04); }
        .drop-zone svg { width: 40px; height: 40px; fill: #a1a1aa; margin-bottom: 12px; }
        .drop-zone-text { font-size: 14px; color: #d4d4d8; font-weight: 500; }
        .drop-zone-text span { color: var(--primary); font-weight: 600; }
        #fileInput { display: none; }

        /* Vùng hiển thị ảnh: mặc định ẩn */
        .preview-container {
            display: none; margin-top: 15px; border-radius: 16px;
            overflow: hidden; border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.4); max-height: 400px; 
            padding: 10px;
            align-items: center; justify-content: center;
        }
        
        .preview-container img { max-width: 100%; max-height: 380px; object-fit: contain; border-radius: 10px; }

        .result-box {
            display: none; margin-top: 20px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 16px; padding: 15px; text-align: left;
        }
        .result-item { margin-bottom: 12px; }
        .result-item:last-child { margin-bottom: 0; }
        .result-label { font-size: 12px; color: #34d399; font-weight: 600; text-transform: uppercase; margin-bottom: 5px; }
        .result-value { 
            font-size: 15px; font-weight: 700; color: white; 
            background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px;
            word-break: break-all;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.08); color: #f4f4f5;
            border: 1px solid var(--glass-border); width: 100%;
            padding: 14px 0; border-radius: 14px; font-size: 15px; font-weight: 600;
            cursor: pointer; margin-top: 20px; display: none;
            text-decoration: none; text-align: center;
        }
        .action-btn:hover { background: rgba(255, 255, 255, 0.15); }

        .status-msg { margin-top: 16px; font-size: 13px; padding: 12px; border-radius: 12px; display: none; }
        .status-msg.loading { display: block; background: rgba(234, 179, 8, 0.12); color: #facc15; }
        .status-msg.error { display: block; background: rgba(239, 68, 68, 0.12); color: #f87171; }
    </style>
</head>
<body>

    <div class="upload-card">
        <div class="logo-badge">
            <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3z"/></svg>
        </div>

        <h2 id="mainTitle">CloudLens Storage</h2>
        <p class="subtitle" id="subTitle">Chọn ảnh để tự động tải lên Google Drive</p>

        <div id="uploadSection">
            <div class="drop-zone" id="dropZone">
                <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5-5-5 5h3v4h4v-4h3z"/></svg>
                <div class="drop-zone-text">Kéo thả ảnh vào đây hoặc <span>chọn file</span></div>
                <input type="file" id="fileInput" accept="image/*">
            </div>
        </div>

        <div class="preview-container" id="previewContainer">
            <!-- Thẻ img không có src ban đầu, sẽ được tạo bằng JS -->
        </div>

        <div class="result-box" id="resultBox">
            <div class="result-item">
                <div class="result-label">ID File </div>
                <div class="result-value" id="displayId">...</div>
            </div>
            <div class="result-item">
                <div class="result-label">Link chia sẻ rút gọn</div>
                <div class="result-value" style="font-weight:400; font-size:13px;" id="displayLink">...</div>
            </div>
        </div>

        <button type="button" class="action-btn" id="resetBtn">Tải ảnh khác ➕</button>
        <a href="#" class="action-btn" id="homeBtn">Trang chủ (Upload)</a>
        
        <div class="status-msg" id="statusMsg"></div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby7QlHVDoWr7aQJMzLrfMWaCukXkFisq3A1BdLhyqcbdnPq2JvsJ0xgmkXrCbYBAKMtRQ/exec';

        const urlParams = new URLSearchParams(window.location.search);
        const imageId = urlParams.get('id');

        const mainTitle = document.getElementById('mainTitle');
        const subTitle = document.getElementById('subTitle');
        const uploadSection = document.getElementById('uploadSection');
        const previewContainer = document.getElementById('previewContainer');
        const statusMsg = document.getElementById('statusMsg');
        
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const resultBox = document.getElementById('resultBox');
        const displayId = document.getElementById('displayId');
        const displayLink = document.getElementById('displayLink');
        const resetBtn = document.getElementById('resetBtn');
        const homeBtn = document.getElementById('homeBtn');

        function showStatus(text, type) {
            statusMsg.textContent = text;
            statusMsg.className = `status-msg ${type}`;
        }
        function hideStatus() {
            statusMsg.className = 'status-msg';
            statusMsg.style.display = 'none';
        }

        // Tạo thẻ img và nhúng ảnh an toàn
        function renderImage(base64Src) {
            previewContainer.innerHTML = `<img src="${base64Src}" alt="Ảnh hiển thị">`;
            previewContainer.style.display = 'flex';
        }

        if (imageId) {
            uploadSection.style.display = 'none';
            mainTitle.textContent = "Xem Ảnh";
            subTitle.textContent = "ID: " + imageId;
            showStatus('Đang tải ảnh từ máy chủ...', 'loading');

            fetch(APPS_SCRIPT_URL + "?id=" + imageId)
            .then(res => res.json())
            .then(data => {
                if(data.status === "success" && data.base64Image) {
                    hideStatus();
                    renderImage(data.base64Image);
                    homeBtn.style.display = 'block'; 
                } else {
                    showStatus(data.message || 'Không tải được ảnh', 'error');
                    homeBtn.style.display = 'block';
                }
            })
            .catch(err => {
                showStatus('Lỗi mạng khi tải ảnh!', 'error');
                homeBtn.style.display = 'block';
            });
            
            homeBtn.addEventListener('click', (e) => {
                e.preventDefault();
                window.location.href = window.location.pathname; 
            });
        } 
        
        else {
            dropZone.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    handleAndUploadFile(this.files[0]);
                }
            });

            resetBtn.addEventListener('click', resetForm);

            function resetForm() {
                fileInput.value = '';
                previewContainer.innerHTML = ''; // Xóa sạch nội dung ảnh cũ
                uploadSection.style.display = 'block';
                previewContainer.style.display = 'none';
                resultBox.style.display = 'none';
                resetBtn.style.display = 'none';
                hideStatus();
            }

            function handleAndUploadFile(file) {
                if (!file.type.startsWith('image/')) {
                    showStatus('Vui lòng chỉ chọn tệp hình ảnh!', 'error');
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = e => {
                    const localBase64Data = e.target.result;
                    
                    // Hiển thị ảnh ngay lập tức bằng dữ liệu local (không bị lỗi icon)
                    renderImage(localBase64Data);
                    uploadSection.style.display = 'none';
                    
                    showStatus('Đang tự động đồng bộ lên Drive...', 'loading');

                    fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            fileName: file.name,
                            mimeType: file.type,
                            base64: localBase64Data
                        })
                    })
                    .then(response => response.json())
                    .then(result => {
                        if (result.status === "success") {
                            hideStatus(); 
                            
                            displayId.textContent = result.id;
                            
                            const currentUrl = window.location.href.split('?')[0]; 
                            const shareUrl = currentUrl + "?id=" + result.id;
                            displayLink.innerHTML = `<a href="${shareUrl}" target="_blank" style="color:white; word-break:break-all;">${shareUrl}</a>`;
                            
                            resultBox.style.display = 'block';
                            resetBtn.style.display = 'block';
                        } else {
                            showStatus('Lỗi: ' + result.message, 'error');
                            resetBtn.style.display = 'block';
                        }
                    })
                    .catch(error => {
                        showStatus('Lỗi kết nối mạng, vui lòng thử lại!', 'error');
                        resetBtn.style.display = 'block';
                    });
                }
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
