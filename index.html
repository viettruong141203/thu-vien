<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CloudLens - Kho Ảnh Đám Mây</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --primary: #8b5cf6;
            --secondary: #3b82f6;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-sub: #a1a1aa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg);
            color: var(--text-main);
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Nền Aurora */
        .aurora-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            overflow: hidden; z-index: -1;
            background: #000;
        }
        .aurora-bg .orb {
            position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.5;
            animation: float 10s infinite ease-in-out alternate;
        }
        .orb-1 { width: 300px; height: 300px; background: var(--primary); top: -50px; left: -50px; }
        .orb-2 { width: 400px; height: 400px; background: var(--secondary); bottom: -100px; right: -100px; animation-delay: -5s; }

        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 50px) scale(1.2); } }

        /* Khung kính chính */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .logo { margin-bottom: 20px; }
        .logo svg { width: 48px; height: 48px; fill: url(#grad); filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.5)); }

        h2 { font-size: 28px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
        p.subtitle { font-size: 14px; color: var(--text-sub); margin-bottom: 30px; font-weight: 300; }

        /* Vùng Upload */
        .drop-zone {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 24px; padding: 40px 20px;
            cursor: pointer; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            background: rgba(255, 255, 255, 0.01);
            position: relative; overflow: hidden;
        }
        .drop-zone:hover { border-color: var(--primary); background: rgba(139, 92, 246, 0.05); transform: translateY(-3px); }
        .drop-zone-icon { font-size: 40px; margin-bottom: 15px; display: block; opacity: 0.8; }
        .drop-zone-text { font-size: 15px; color: #d4d4d8; font-weight: 400; }
        .drop-zone-text span { color: #a78bfa; font-weight: 600; }
        #fileInput { display: none; }

        /* Vùng hiển thị ảnh */
        .image-wrapper {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            display: none;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 1px solid var(--glass-border);
            background: #000;
        }
        .image-wrapper img {
            width: 100%;
            height: auto;
            max-height: 450px;
            object-fit: contain;
            display: block;
            border-radius: 20px;
        }

        /* Nút hành động trước khi lưu */
        .action-group {
            display: none;
            gap: 12px;
            margin-top: 25px;
        }
        .btn {
            flex: 1; padding: 14px 10px; border-radius: 16px; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease; border: none; color: #fff;
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3); }
        .btn-outline { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4); }
        .btn-outline:hover { background: rgba(255,255,255,0.1); }

        /* Loading Spinner */
        .loading-overlay {
            position: absolute; top: 15px; right: 15px;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            padding: 8px 12px; border-radius: 20px;
            display: none; align-items: center; gap: 8px;
            font-size: 12px; font-weight: 500; border: 1px solid rgba(255,255,255,0.1);
        }
        .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Hộp kết quả */
        .result-box {
            display: none; margin-top: 25px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 20px; text-align: left;
            animation: fadeIn 0.5s ease;
        }
        .result-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .result-row:last-child { margin-bottom: 0; }
        .label { font-size: 12px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .value { font-size: 16px; font-weight: 700; color: #fff; }
        .link-value { font-size: 14px; font-weight: 400; color: #a78bfa; word-break: break-all; text-decoration: none; }
        
        .reset-btn {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%; padding: 16px; border-radius: 18px; font-size: 16px; font-weight: 600; color: #fff;
            cursor: pointer; margin-top: 20px; display: none; transition: all 0.3s;
        }
        .reset-btn:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }

        /* Thông báo (Toast) */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399; padding: 12px 24px; border-radius: 100px; font-size: 14px; font-weight: 500;
            backdrop-filter: blur(10px); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.4); color: #f87171; }
    </style>
</head>
<body>

    <div class="aurora-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <svg width="0" height="0">
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
        </linearGradient>
    </svg>

    <div class="glass-card">
        
        <!-- Màn hình chọn ảnh -->
        <div id="uploadSection">
            <div class="logo">
                <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5-5-5 5h3v4h4v-4h3z"/></svg>
            </div>
            <h2>CloudLens</h2>
            <p class="subtitle">Bảo mật - Nhanh chóng - Tiện lợi</p>

            <div class="drop-zone" id="dropZone">
                <span class="drop-zone-icon">📸</span>
                <div class="drop-zone-text">Chạm để chọn hoặc <span>chụp ảnh</span></div>
                <!-- accept="image/*" trên mobile sẽ cho phép cả chụp camera và chọn thư viện -->
                <input type="file" id="fileInput" accept="image/*">
            </div>
        </div>

        <!-- Màn hình xem trước & Trạng thái tải -->
        <div class="image-wrapper" id="imageWrapper">
            <img id="imagePreview" src="" alt="View">
            <div class="loading-overlay" id="loadingOverlay">
                <div class="spinner"></div> Đang đồng bộ...
            </div>
        </div>

        <!-- Nút xác nhận: Lưu Drive hoặc Chọn ảnh khác -->
        <div class="action-group" id="confirmActions">
            <button type="button" class="btn btn-outline" id="cancelBtn">Đổi ảnh khác</button>
            <button type="button" class="btn btn-primary" id="saveBtn">Lưu lên Drive</button>
        </div>

        <!-- Màn hình kết quả -->
        <div class="result-box" id="resultBox">
            <div class="result-row">
                <div class="label">ID Bảo mật</div>
                <div class="value" id="displayId">...</div>
            </div>
            <div style="height: 1px; background: rgba(255,255,255,0.1); margin: 15px 0;"></div>
            <div class="result-row" style="flex-direction: column; align-items: flex-start; gap: 8px;">
                <div class="label">Link chia sẻ (Nhấn để copy)</div>
                <a href="#" class="link-value" id="displayLink">...</a>
            </div>
        </div>

        <!-- Nút Reset cuối cùng -->
        <button type="button" class="reset-btn" id="resetBtn">Tải ảnh mới ➕</button>
    </div>

    <div class="toast" id="toastMsg">Thành công!</div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby7QlHVDoWr7aQJMzLrfMWaCukXkFisq3A1BdLhyqcbdnPq2JvsJ0xgmkXrCbYBAKMtRQ/exec';
        
        const urlParams = new URLSearchParams(window.location.search);
        const imageId = urlParams.get('id');

        const uploadSection = document.getElementById('uploadSection');
        const imageWrapper = document.getElementById('imageWrapper');
        const imagePreview = document.getElementById('imagePreview');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const confirmActions = document.getElementById('confirmActions');
        
        const resultBox = document.getElementById('resultBox');
        const displayId = document.getElementById('displayId');
        const displayLink = document.getElementById('displayLink');
        
        const cancelBtn = document.getElementById('cancelBtn');
        const saveBtn = document.getElementById('saveBtn');
        const resetBtn = document.getElementById('resetBtn');
        const toastMsg = document.getElementById('toastMsg');

        let pendingFile = null; // Biến tạm lưu ảnh đang chờ xác nhận

        function showToast(text, isError = false) {
            toastMsg.textContent = text;
            toastMsg.className = isError ? 'toast show error' : 'toast show';
            setTimeout(() => { toastMsg.className = 'toast'; }, 3000);
        }

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1600; const MAX_HEIGHT = 1600; 
                    let width = img.width; let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7); 
                    callback(compressedDataUrl);
                }
            }
        }

        // --- TRƯỜNG HỢP 1: CHẾ ĐỘ XEM ẢNH TỪ LINK CÓ "?id=..." ---
        if (imageId) {
            uploadSection.style.display = 'none';
            imageWrapper.style.display = 'block';
            loadingOverlay.style.display = 'flex';
            loadingOverlay.innerHTML = '<div class="spinner"></div> Đang mở ảnh...';

            fetch(APPS_SCRIPT_URL + "?id=" + imageId)
            .then(res => res.json())
            .then(data => {
                loadingOverlay.style.display = 'none';
                if(data.status === "success" && data.base64Image) {
                    imagePreview.src = data.base64Image;
                } else {
                    showToast('Lỗi: Ảnh không tồn tại', true);
                }
            }).catch(() => {
                loadingOverlay.style.display = 'none';
                showToast('Lỗi mạng khi tải ảnh', true);
            });
        } 
        
        // --- TRƯỜNG HỢP 2: CHẾ ĐỘ TẢI ẢNH LÊN ---
        else {
            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('fileInput');

            dropZone.addEventListener('click', () => fileInput.click());

            // 1. Khi người dùng chọn/chụp ảnh xong
            fileInput.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    if (!this.files[0].type.startsWith('image/')) {
                        showToast('Vui lòng chọn hình ảnh!', true); return;
                    }
                    
                    pendingFile = this.files[0];
                    const reader = new FileReader();
                    reader.onload = e => {
                        imagePreview.src = e.target.result; // Hiện preview
                        uploadSection.style.display = 'none'; // Ẩn nút chụp
                        imageWrapper.style.display = 'block'; // Hiện khung ảnh
                        confirmActions.style.display = 'flex'; // HIỆN 2 NÚT XÁC NHẬN
                    }
                    reader.readAsDataURL(pendingFile);
                }
            });

            // 2. Nếu bấm "Đổi ảnh khác"
            cancelBtn.addEventListener('click', () => {
                pendingFile = null;
                fileInput.value = '';
                imagePreview.src = '';
                uploadSection.style.display = 'block'; // Trả lại nút chụp ban đầu
                imageWrapper.style.display = 'none';
                confirmActions.style.display = 'none';
            });

            // 3. Nếu bấm "Lưu lên Drive"
            saveBtn.addEventListener('click', () => {
                if (!pendingFile) return;
                
                confirmActions.style.display = 'none'; // Ẩn 2 nút đi
                loadingOverlay.style.display = 'flex'; // Hiện chữ "Đang đồng bộ..."
                
                compressImage(pendingFile, (compressedBase64) => {
                    fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ fileName: pendingFile.name, mimeType: 'image/jpeg', base64: compressedBase64 })
                    })
                    .then(response => response.json())
                    .then(result => {
                        loadingOverlay.style.display = 'none'; 
                        if (result.status === "success") {
                            showToast('Lưu đám mây thành công!');
                            displayId.textContent = result.id;
                            
                            const shareUrl = window.location.href.split('?')[0] + "?id=" + result.id;
                            displayLink.textContent = shareUrl;
                            displayLink.href = shareUrl;
                            
                            resultBox.style.display = 'block';
                            resetBtn.style.display = 'block';
                        } else {
                            showToast('Lỗi: ' + result.message, true);
                            cancelBtn.click(); // Reset lại nếu lỗi
                        }
                    })
                    .catch(error => {
                        loadingOverlay.style.display = 'none';
                        showToast('Lỗi kết nối mạng!', true);
                        cancelBtn.click();
                    });
                });
            });

            // Copy Link dễ dàng
            displayLink.addEventListener('click', (e) => {
                e.preventDefault();
                navigator.clipboard.writeText(displayLink.textContent).then(() => {
                    showToast('Đã copy link chia sẻ!');
                });
            });

            // Reset toàn bộ app sau khi upload xong
            resetBtn.addEventListener('click', () => {
                cancelBtn.click(); // Dùng chung logic reset của nút Cancel
                resultBox.style.display = 'none';
                resetBtn.style.display = 'none';
            });
        }
    </script>
</body>
</html>
