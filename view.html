<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CloudLens - Kho Ảnh Đám Mây</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --primary: #8b5cf6; --secondary: #3b82f6; --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08); --text-main: #ffffff; --text-sub: #a1a1aa; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; background-color: var(--bg); color: var(--text-main); padding: 80px 20px 40px; overflow-x: hidden; position: relative; }

        /* Nền Aurora */
        .aurora-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; z-index: -1; background: #000; }
        .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.5; animation: float 10s infinite ease-in-out alternate; }
        .orb-1 { width: 300px; height: 300px; background: var(--primary); top: -50px; left: -50px; }
        .orb-2 { width: 400px; height: 400px; background: var(--secondary); bottom: -100px; right: -100px; animation-delay: -5s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 50px) scale(1.2); } }

        /* THANH MENU (TABS) */
        .tab-menu { position: fixed; top: 20px; z-index: 10; display: flex; background: rgba(0,0,0,0.6); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 100px; padding: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .tab-btn { padding: 10px 24px; border-radius: 100px; font-size: 15px; font-weight: 600; color: var(--text-sub); cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4); }

        /* Khung kính chính */
        .glass-card { background: var(--glass-bg); backdrop-filter: blur(30px); border: 1px solid var(--glass-border); border-radius: 32px; padding: 40px 30px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6); animation: fadeIn 0.5s; display: none; }
        .glass-card.active { display: block; }

        /* THƯ VIỆN ẢNH (GALLERY) */
        .gallery-card { max-width: 800px; padding: 25px 20px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; margin-top: 20px; }
        .gallery-item { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 1/1; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .gallery-item:hover { transform: scale(1.05); border-color: var(--primary); box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
        .gallery-empty { grid-column: 1 / -1; color: var(--text-sub); padding: 40px 0; font-size: 15px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .logo svg { width: 48px; height: 48px; fill: url(#grad); filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.5)); margin-bottom: 20px; }
        h2 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        p.subtitle { font-size: 14px; color: var(--text-sub); margin-bottom: 30px; font-weight: 300; }

        /* Upload UI */
        .drop-zone { border: 2px dashed rgba(255, 255, 255, 0.15); border-radius: 24px; padding: 40px 20px; cursor: pointer; background: rgba(255, 255, 255, 0.01); transition: 0.3s; }
        .drop-zone-icon { font-size: 40px; margin-bottom: 15px; display: block; }
        .drop-zone-text { font-size: 15px; color: #d4d4d8; }
        .drop-zone-text span { color: #a78bfa; font-weight: 600; }
        #fileInput { display: none; }
        
        .image-wrapper { position: relative; border-radius: 20px; overflow: hidden; display: none; border: 1px solid var(--glass-border); background: #000; }
        .image-wrapper img { width: 100%; max-height: 450px; object-fit: contain; display: block; }
        
        .action-group { display: none; gap: 12px; margin-top: 25px; }
        .btn { flex: 1; padding: 14px 10px; border-radius: 16px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; border: none; color: #fff; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); }
        .btn-outline { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
        
        .loading-overlay { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); padding: 8px 12px; border-radius: 20px; display: none; align-items: center; gap: 8px; font-size: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .result-box { display: none; margin-top: 25px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 20px; text-align: left; }
        .result-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .label { font-size: 12px; color: var(--text-sub); text-transform: uppercase; font-weight: 600; }
        .value { font-size: 16px; font-weight: 700; color: #fff; }
        .link-value { font-size: 14px; color: #a78bfa; word-break: break-all; text-decoration: none; }
        
        .reset-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; padding: 16px; border-radius: 18px; font-size: 16px; font-weight: 600; color: #fff; cursor: pointer; margin-top: 20px; display: none; }
        
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; padding: 12px 24px; border-radius: 100px; font-size: 14px; font-weight: 500; backdrop-filter: blur(10px); transition: 0.4s; z-index: 1000; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.4); color: #f87171; }
    </style>
</head>
<body>

    <div class="aurora-bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
    <svg width="0" height="0"><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" /><stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" /></linearGradient></svg>

    <!-- MENU TABS -->
    <div class="tab-menu">
        <div class="tab-btn active" id="tabUpload">📸 Tải lên</div>
        <div class="tab-btn" id="tabGallery">🖼️ Thư viện</div>
    </div>

    <!-- MÀN HÌNH TẢI ẢNH -->
    <div class="glass-card active" id="viewUpload">
        <div id="uploadSection">
            <div class="logo"><svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5-5-5 5h3v4h4v-4h3z"/></svg></div>
            <h2>CloudLens</h2>
            <p class="subtitle">Chạm để chọn hoặc chụp ảnh</p>

            <div class="drop-zone" id="dropZone">
                <span class="drop-zone-icon">📸</span>
                <div class="drop-zone-text">Tải ảnh lên an toàn</div>
                <input type="file" id="fileInput" accept="image/*">
            </div>
        </div>

        <div class="image-wrapper" id="imageWrapper">
            <img id="imagePreview" src="" alt="View">
            <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div> Đang đồng bộ...</div>
        </div>

        <div class="action-group" id="confirmActions">
            <button type="button" class="btn btn-outline" id="cancelBtn">Chụp lại</button>
            <button type="button" class="btn btn-primary" id="saveBtn">Lưu lên Drive</button>
        </div>

        <div class="result-box" id="resultBox">
            <div class="result-row"><div class="label">Mã ID</div><div class="value" id="displayId">...</div></div>
            <div style="height: 1px; background: rgba(255,255,255,0.1); margin: 15px 0;"></div>
            <div class="result-row" style="flex-direction: column; align-items: flex-start; gap: 8px;">
                <div class="label">Link xem ảnh (Nhấn để copy)</div>
                <a href="#" class="link-value" id="displayLink">...</a>
            </div>
        </div>

        <button type="button" class="reset-btn" id="resetBtn">Tải ảnh mới ➕</button>
    </div>

    <!-- MÀN HÌNH THƯ VIỆN -->
    <div class="glass-card gallery-card" id="viewGallery">
        <h2>Thư viện của bạn</h2>
        <p class="subtitle">Tất cả ảnh đã lưu trên hệ thống</p>
        
        <div id="galleryLoading" style="display:none; color: #a1a1aa; margin: 30px 0;"><div class="spinner" style="margin: 0 auto 10px;"></div> Đang tải dữ liệu...</div>
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <div class="toast" id="toastMsg">Thành công!</div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby7QlHVDoWr7aQJMzLrfMWaCukXkFisq3A1BdLhyqcbdnPq2JvsJ0xgmkXrCbYBAKMtRQ/exec';
        
        // --- CHUYỂN ĐỔI TABS ---
        const tabUpload = document.getElementById('tabUpload');
        const tabGallery = document.getElementById('tabGallery');
        const viewUpload = document.getElementById('viewUpload');
        const viewGallery = document.getElementById('viewGallery');

        tabUpload.addEventListener('click', () => {
            tabUpload.classList.add('active'); tabGallery.classList.remove('active');
            viewUpload.classList.add('active'); viewGallery.classList.remove('active');
        });

        tabGallery.addEventListener('click', () => {
            tabGallery.classList.add('active'); tabUpload.classList.remove('active');
            viewGallery.classList.add('active'); viewUpload.classList.remove('active');
            loadGallery();
        });

        // --- XỬ LÝ UPLOAD ---
        let pendingFile = null;
        function showToast(text, isError = false) {
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = text; toastMsg.className = isError ? 'toast show error' : 'toast show';
            setTimeout(() => { toastMsg.className = 'toast'; }, 3000);
        }

        function compressImage(file, callback) {
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = e => {
                const img = new Image(); img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > h && w > 1600) { h *= 1600 / w; w = 1600; } 
                    else if (h > 1600) { w *= 1600 / h; h = 1600; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                }
            }
        }

        document.getElementById('dropZone').addEventListener('click', () => document.getElementById('fileInput').click());
        document.getElementById('fileInput').addEventListener('change', function() {
            if (this.files && this.files[0]) {
                pendingFile = this.files[0];
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('imagePreview').src = e.target.result;
                    document.getElementById('uploadSection').style.display = 'none';
                    document.getElementById('imageWrapper').style.display = 'block';
                    document.getElementById('confirmActions').style.display = 'flex';
                }
                reader.readAsDataURL(pendingFile);
            }
        });

        document.getElementById('cancelBtn').addEventListener('click', () => {
            document.getElementById('fileInput').value = '';
            document.getElementById('uploadSection').style.display = 'block';
            document.getElementById('imageWrapper').style.display = 'none';
            document.getElementById('confirmActions').style.display = 'none';
        });

        document.getElementById('saveBtn').addEventListener('click', () => {
            if (!pendingFile) return;
            document.getElementById('confirmActions').style.display = 'none';
            document.getElementById('loadingOverlay').style.display = 'flex';
            
            compressImage(pendingFile, (compressedBase64) => {
                fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ fileName: pendingFile.name, mimeType: 'image/jpeg', base64: compressedBase64 })
                }).then(res => res.json()).then(result => {
                    document.getElementById('loadingOverlay').style.display = 'none';
                    if (result.status === "success") {
                        showToast('Đã lưu vào Drive!');
                        document.getElementById('displayId').textContent = result.id;
                        
                        const baseUrl = window.location.href.replace(/index\.html.*/, '').replace(/\/$/, '');
                        const shareUrl = baseUrl + "/view.html?id=" + result.id;
                        
                        document.getElementById('displayLink').textContent = shareUrl;
                        document.getElementById('displayLink').href = shareUrl;
                        document.getElementById('resultBox').style.display = 'block';
                        document.getElementById('resetBtn').style.display = 'block';
                    } else { showToast('Lỗi: ' + result.message, true); document.getElementById('cancelBtn').click(); }
                }).catch(() => {
                    document.getElementById('loadingOverlay').style.display = 'none'; showToast('Lỗi mạng!', true); document.getElementById('cancelBtn').click();
                });
            });
        });

        document.getElementById('displayLink').addEventListener('click', (e) => {
            e.preventDefault();
            navigator.clipboard.writeText(e.target.href).then(() => showToast('Đã copy link!'));
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            document.getElementById('cancelBtn').click(); 
            document.getElementById('resultBox').style.display = 'none'; 
            document.getElementById('resetBtn').style.display = 'none';
        });

        // --- XỬ LÝ LOAD THƯ VIỆN ---
        function loadGallery() {
            const grid = document.getElementById('galleryGrid');
            const loading = document.getElementById('galleryLoading');
            grid.innerHTML = '';
            loading.style.display = 'block';

            fetch(APPS_SCRIPT_URL + "?action=gallery")
            .then(res => res.json())
            .then(data => {
                loading.style.display = 'none';
                if(data.status === "success") {
                    if(data.data.length === 0) {
                        grid.innerHTML = '<div class="gallery-empty">Chưa có ảnh nào được tải lên</div>';
                        return;
                    }
                    
                    const baseUrl = window.location.href.replace(/index\.html.*/, '').replace(/\/$/, '');
                    
                    data.data.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'gallery-item';
                        // Dùng referrerpolicy để vượt qua chính sách chặn ảnh của Drive
                        div.innerHTML = `<img src="${item.thumb}" loading="lazy" referrerpolicy="no-referrer">`;
                        
                        // Bấm vào ảnh sẽ mở tab view.html
                        div.onclick = () => {
                            window.open(baseUrl + "/view.html?id=" + item.id, '_blank');
                        };
                        grid.appendChild(div);
                    });
                } else {
                    grid.innerHTML = '<div class="gallery-empty">Lỗi tải dữ liệu</div>';
                }
            }).catch(() => {
                loading.style.display = 'none';
                grid.innerHTML = '<div class="gallery-empty">Lỗi kết nối mạng</div>';
            });
        }
    </script>
</body>
</html>
