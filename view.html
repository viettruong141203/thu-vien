<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CloudLens - Xem Ảnh</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --primary: #8b5cf6; --secondary: #3b82f6; --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { min-height: 100vh; display: flex; justify-content: center; align-items: center; background: var(--bg); color: #fff; padding: 20px; overflow-x: hidden; }
        
        .aurora-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; background: #000; overflow: hidden; }
        .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.5; animation: float 10s infinite ease-in-out alternate; }
        .orb-1 { width: 300px; height: 300px; background: var(--primary); top: -50px; left: -50px; }
        .orb-2 { width: 400px; height: 400px; background: var(--secondary); bottom: -100px; right: -100px; animation-delay: -5s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 50px) scale(1.2); } }

        .glass-card { background: var(--glass-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid var(--glass-border); border-radius: 32px; padding: 30px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.6); animation: fadeIn 0.8s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .image-wrapper { border-radius: 20px; overflow: hidden; position: relative; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.5); min-height: 200px; display: flex; justify-content: center; align-items: center; }
        .image-wrapper img { width: 100%; max-height: 600px; object-fit: contain; display: none; }
        
        .loading-state { display: flex; flex-direction: column; align-items: center; gap: 15px; color: #a1a1aa; font-size: 14px; }
        .spinner { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-upload { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); width: 100%; padding: 16px; border-radius: 18px; font-size: 15px; font-weight: 600; color: #fff; cursor: pointer; margin-top: 20px; text-decoration: none; display: inline-block; transition: 0.3s; }
        .btn-upload:hover { background: rgba(255,255,255,0.15); }
    </style>
</head>
<body>
    <div class="aurora-bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

    <div class="glass-card">
        <div class="image-wrapper" id="imageWrapper">
            <div class="loading-state" id="loadingState">
                <div class="spinner"></div>
                <p>Đang tải ảnh an toàn...</p>
            </div>
            <img id="imageDisplay" src="" alt="View">
        </div>

        <a href="index.html" class="btn-upload">Tải ảnh của bạn lên CloudLens</a>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby7QlHVDoWr7aQJMzLrfMWaCukXkFisq3A1BdLhyqcbdnPq2JvsJ0xgmkXrCbYBAKMtRQ/exec';
        
        const urlParams = new URLSearchParams(window.location.search);
        const imageId = urlParams.get('id');

        const loadingState = document.getElementById('loadingState');
        const imageDisplay = document.getElementById('imageDisplay');

        if (imageId) {
            fetch(APPS_SCRIPT_URL + "?id=" + imageId)
            .then(res => res.json())
            .then(data => {
                loadingState.style.display = 'none';
                if(data.status === "success" && data.base64Image) {
                    imageDisplay.src = data.base64Image;
                    imageDisplay.style.display = 'block';
                } else {
                    loadingState.style.display = 'flex';
                    loadingState.innerHTML = '<p style="color:#f87171">⚠️ Ảnh không tồn tại hoặc đã bị xóa</p>';
                }
            }).catch(() => {
                loadingState.style.display = 'flex';
                loadingState.innerHTML = '<p style="color:#f87171">⚠️ Lỗi mạng, vui lòng thử lại!</p>';
            });
        } else {
            loadingState.innerHTML = '<p style="color:#f87171">⚠️ Link không hợp lệ (Thiếu ID)</p>';
        }
    </script>
</body>
</html>
